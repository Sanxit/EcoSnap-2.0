<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/camera-32.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your free account — EcoSnap</title>
  <meta name="description"
    content="Join EcoSnap to discover event photographers or showcase your professional photography portfolio." />

  <!-- Preload Collage Background -->
  <link rel="preload" as="image" href="../assets/img/signup-collage-bg.jpg" />

<!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Red+Rose:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Remixicon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>

<body>

  <!-- ============================================
       DARK DIMMED COLLAGE BACKDROP WRAPPER
       ============================================ -->
  <div class="signup-collage-layout">

    <!-- ============================================
         FLOATING WHITE SIGNUP CARD
         ============================================ -->
    <div class="signup-card">

      <!-- EcoSnap Brand Logo -->
      <a href="../index.html" class="navbar-brand" title="EcoSnap Home">
        <i class="ri-camera-lens-fill"></i>
        ECO SNAP
      </a>

      <!-- Heading & Subtitle -->
      <h1 class="signup-title">Create your free account</h1>
      <p class="signup-subtitle">No credit card required</p>

      <!-- Account Type Segmented Toggle -->
      <div class="signup-role-toggle" id="accountTypeToggle" role="tablist" aria-label="Account type selection">
        <button type="button" class="signup-role-btn type-btn active" data-type="client" id="typeBtnClient" role="tab"
          aria-selected="true" aria-controls="formClient">
          <i class="ri-user-3-line"></i>
          <span>I'm a Client</span>
        </button>
        <button type="button" class="signup-role-btn type-btn" data-type="photographer" id="typeBtnPhotographer"
          role="tab" aria-selected="false" aria-controls="formPhotographer">
          <i class="ri-camera-lens-line"></i>
          <span>I'm a Photographer</span>
        </button>
      </div>

      <!-- ============================================
           CLIENT FORM
           ============================================ -->
      <form class="signup-form auth-form" id="formClient" action="../index.html" method="GET"
        onsubmit="handleSignup(event, 'client')" novalidate>
        <input type="hidden" name="role" value="client" />

        <!-- Full Name & Phone Number Row -->
        <div class="signup-form-row">
          <div class="signup-form-group">
            <label for="clientFullName">Full Name</label>
            <input type="text" id="clientFullName" name="fullName" class="signup-input" placeholder="Jhon Sharma"
              required autocomplete="name" />
          </div>
          <div class="signup-form-group">
            <label for="clientPhone">Phone Number</label>
            <input type="tel" id="clientPhone" name="phoneNumber" class="signup-input" placeholder="+977 9801234567"
              autocomplete="tel" />
          </div>
        </div>

        <!-- Email -->
        <div class="signup-form-group">
          <label for="clientEmail">Email</label>
          <input type="email" id="clientEmail" name="email" class="signup-input" placeholder="name@example.com"
            required autocomplete="email" />
        </div>

        <!-- Password -->
        <div class="signup-form-group signup-pw-wrap">
          <label for="clientPassword">Password</label>
          <div class="signup-pw-field">
            <input type="password" id="clientPassword" name="password" class="signup-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              required autocomplete="new-password" minlength="6" />
            <button type="button" class="signup-pw-toggle" onclick="togglePassword('clientPassword', 'clientPwIcon')"
              aria-label="Toggle password visibility" tabindex="-1">
              <i class="ri-eye-off-line" id="clientPwIcon"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="signup-form-group signup-pw-wrap">
          <label for="clientConfirmPassword">Confirm Password</label>
          <div class="signup-pw-field">
            <input type="password" id="clientConfirmPassword" name="confirmPassword" class="signup-input"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="new-password" minlength="6" />
            <button type="button" class="signup-pw-toggle"
              onclick="togglePassword('clientConfirmPassword', 'clientConfirmPwIcon')"
              aria-label="Toggle confirm password visibility" tabindex="-1">
              <i class="ri-eye-off-line" id="clientConfirmPwIcon"></i>
            </button>
          </div>
        </div>

        <!-- Required Terms Checkbox (hidden) -->
        <input type="checkbox" id="clientTerms" name="terms" checked required
          style="position: absolute; opacity: 0; pointer-events: none;" />

        <!-- Submit -->
        <button type="submit" class="btn-min-login btn-signup-primary" id="clientSubmitBtn">
          Continue
        </button>

        <!-- Switch to Login -->
        <div class="signup-footer-switch">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </form>

      <!-- ============================================
           PHOTOGRAPHER FORM
           ============================================ -->
      <form class="signup-form auth-form" id="formPhotographer" action="../index.html" method="GET"
        onsubmit="handleSignup(event, 'photographer')" novalidate
        style="display: none;">
        <input type="hidden" name="role" value="photographer" />

        <!-- Full Name & Phone Number Row -->
        <div class="signup-form-row">
          <div class="signup-form-group">
            <label for="photoFullName">Full Name</label>
            <input type="text" id="photoFullName" name="fullName" class="signup-input" placeholder="Jhon Sharma"
              required autocomplete="name" />
          </div>
          <div class="signup-form-group">
            <label for="photoPhone">Phone Number</label>
            <input type="tel" id="photoPhone" name="phoneNumber" class="signup-input" placeholder="+977 9801234567"
              autocomplete="tel" />
          </div>
        </div>

        <!-- Email -->
        <div class="signup-form-group">
          <label for="photoEmail">Email</label>
          <input type="email" id="photoEmail" name="email" class="signup-input" placeholder="name@example.com"
            required autocomplete="email" />
        </div>

        <!-- Password -->
        <div class="signup-form-group signup-pw-wrap">
          <label for="photoPassword">Password</label>
          <div class="signup-pw-field">
            <input type="password" id="photoPassword" name="password" class="signup-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              required autocomplete="new-password" minlength="6" />
            <button type="button" class="signup-pw-toggle" onclick="togglePassword('photoPassword', 'photoPwIcon')"
              aria-label="Toggle password visibility" tabindex="-1">
              <i class="ri-eye-off-line" id="photoPwIcon"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="signup-form-group signup-pw-wrap">
          <label for="photoConfirmPassword">Confirm Password</label>
          <div class="signup-pw-field">
            <input type="password" id="photoConfirmPassword" name="confirmPassword" class="signup-input"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="new-password" minlength="6" />
            <button type="button" class="signup-pw-toggle"
              onclick="togglePassword('photoConfirmPassword', 'photoConfirmPwIcon')"
              aria-label="Toggle confirm password visibility" tabindex="-1">
              <i class="ri-eye-off-line" id="photoConfirmPwIcon"></i>
            </button>
          </div>
        </div>

        <!-- Photographer-specific fields -->
        <div class="signup-form-group">
          <label for="specialization">Specialization</label>
          <input type="text" id="specialization" name="specialization" class="signup-input"
            placeholder="e.g. Wedding, Portrait, Commercial" required />
        </div>

        <div class="signup-form-row">
          <div class="signup-form-group">
            <label for="experienceYears">Years of Experience</label>
            <input type="number" id="experienceYears" name="experienceYears" class="signup-input"
              placeholder="e.g. 5" min="0" max="60" required />
          </div>
          <div class="signup-form-group">
            <label for="hourlyRate">Hourly Rate (NPR)</label>
            <input type="number" id="hourlyRate" name="hourlyRate" class="signup-input"
              placeholder="e.g. 3000" min="0" required />
          </div>
        </div>

        <div class="signup-form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" class="signup-input"
            placeholder="e.g. Kathmandu, Nepal" required />
        </div>

        <!-- Required Terms Checkbox (hidden) -->
        <input type="checkbox" id="photoTerms" name="terms" checked required
          style="position: absolute; opacity: 0; pointer-events: none;" />

        <!-- Submit -->
        <button type="submit" class="btn-min-login btn-signup-primary" id="photoSubmitBtn">
          Continue
        </button>

        <!-- Switch to Login -->
        <div class="signup-footer-switch">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </form>

    </div>
  </div>

  <!-- JavaScript -->
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/register.js"></script>
</body>

</html>
