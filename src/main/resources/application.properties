# Server
# Load local .env values when running from IntelliJ or Java directly.
# Deployment platforms should provide these variables through their environment.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access.expiration=86400000

# Mail / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Public site URLs used in notification emails
ecosnap.base-url=${APP_BASE_URL:http://localhost:8080}

# Admin seeder
ecosnap.admin.email=${ECOSNAP_ADMIN_EMAIL:admin@ecosnap.com}
ecosnap.admin.password=${ECOSNAP_ADMIN_PASSWORD:Admin@12345}
